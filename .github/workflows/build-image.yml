name: Build and push images to GitHub Container Registry

on:
  workflow_call:
    inputs:
      is_beta_version:
        description: Publish the images with the beta tag
        required: false
        type: boolean
        default: false
    secrets:
      TRUSTPKG_GHCR:
        required: false

jobs:
  push-image-to-github-registry:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-service
          - replicator-service
          - database-service
    env:
      IS_BETA_VERSION: ${{ inputs.is_beta_version }}
      SERVICE: ${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Build image
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/$SERVICE"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            image_tags=("beta-pr-${PR_NUMBER}")
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            image_tags=("$REF_NAME")
            if [[ "$IS_BETA_VERSION" != "true" ]]; then
              image_tags+=("latest")
            fi
          elif [[ "$IS_BETA_VERSION" == "true" ]]; then
            image_tags=("beta")
          else
            image_tags=("latest")
          fi

          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "manifest=$image_name:${image_tags[0]}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            printf '%s\n' "${image_tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          podman build \
            --build-arg "SERVICE=$SERVICE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --manifest "$image_name:${image_tags[0]}" \
            --platform linux/amd64,linux/arm64 \
            .
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.TRUSTPKG_GHCR }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" |
            podman login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin

      - name: Push image
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_MANIFEST: ${{ steps.image.outputs.manifest }}
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        shell: bash
        run: |
          while IFS= read -r image_tag; do
            [[ -n "$image_tag" ]] &&
              podman manifest push --all "$IMAGE_MANIFEST" "docker://$IMAGE_NAME:$image_tag"
          done <<< "$IMAGE_TAGS"
