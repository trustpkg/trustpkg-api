basePath: /api
definitions:
  packagesApi.SearchDocument:
    properties:
      ecosystem:
        description: Package ecosystem.
        enum:
        - npm
        type: string
      id:
        description: Database package identifier.
        maxLength: 19
        minLength: 1
        type: string
      is_deprecated:
        description: Whether npm marks the package as deprecated.
        type: boolean
      name:
        description: npm package name.
        maxLength: 214
        minLength: 1
        type: string
      popularity:
        description: Download popularity score.
        minimum: 0
        type: integer
      vulnerabilities:
        additionalProperties:
          type: integer
        description: Monthly vulnerability counts keyed by YYYY-MM.
        type: object
    required:
    - ecosystem
    - id
    - is_deprecated
    - name
    - popularity
    - vulnerabilities
    type: object
  packagesApi.SearchResponse:
    properties:
      documents:
        items:
          $ref: '#/definitions/packagesApi.SearchDocument'
        type: array
      message:
        maxLength: 64
        minLength: 1
        type: string
      status:
        enum:
        - 200
        - 400
        - 429
        - 500
        type: integer
    required:
    - message
    - status
    type: object
info:
  contact: {}
  description: API for searching npm packages and their vulnerability data.
  title: TrustPkg API
  version: 1.3.0
paths:
  /packages/search:
    get:
      description: Searches npm package names using prefix matching and returns the
        complete package documents.
      operationId: searchPackages
      parameters:
      - description: Package name or scoped package name
        in: query
        maxLength: 214
        minLength: 1
        name: query
        required: true
        type: string
      - default: 10
        description: Maximum number of results
        in: query
        maximum: 20
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/packagesApi.SearchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/packagesApi.SearchResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/packagesApi.SearchResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/packagesApi.SearchResponse'
      summary: Search packages
      tags:
      - packages
schemes:
- http
- https
swagger: "2.0"
