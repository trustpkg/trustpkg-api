root = "."
tmp_dir = "tmp"

[build]
  cmd = "templ generate; go build -o ./bin/api-service.exe ./cmd/api-service/main.go"
  entrypoint = "./bin/api-service.exe"

  include_ext = ["go"]
  include_dir = ["cmd", "internal"]

  exclude_dir = [
    "tmp",
    "vendor",
    "bin",
  ]

  delay = 1000
  stop_on_error = true