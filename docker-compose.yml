services:
  db:
    image: docker.io/library/postgres:16
    restart: always
    ports: 
      - 5433:5432
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: postgres
      TZ: UTC
    volumes:
      - data:/var/lib/postgresql/data
    networks:
      - trustpkg-net

  adminer:
    image: docker.io/library/adminer
    restart: always
    ports:
      - 8081:8080
    depends_on: 
      - db
    network:
      - trustpkg-net
    
volumes:
    data:
  
networks:
  trustpkg-net:
    driver: bridge